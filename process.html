<script>
  /* Stamp the theme before first paint so there is no flash. Dark is the default. */
  (function () {
    try {
      var s = localStorage.getItem("oellm.theme") || "dark";
      if (s === "auto") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", s);
    } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
  })();
</script>
